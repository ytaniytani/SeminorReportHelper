[project]
name = "seminar-report-helper"
version = "0.1.0"
description = "セミナー動画(.mp4)から画像付きレポートを生成し Confluence に反映するツール"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "pillow>=10.3",
    "imageio-ffmpeg>=0.5",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# 文字起こし。CPU のみでも動くが、GPU があれば大幅に速い。
asr = ["faster-whisper>=1.0.3"]
llm = ["anthropic>=0.34", "openai>=1.40"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[project.scripts]
seminar-report = "seminar_report.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seminar_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
